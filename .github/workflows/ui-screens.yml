name: UI screenshots

# Прогон приложения на эмуляторе Android: тест ScreenshotTour проходит по экранам
# (светлая и тёмная тема, а также узкий экран 360 dp с крупным шрифтом) и снимает скриншоты. Результат — в ветке ui-screens.
# Запуск вручную: Actions → UI screenshots → Run workflow.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      # compileSdk 37 (его требует Kyant Backdrop): на раннере этой платформы может не быть
      - name: Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Настройки Gradle для CI
        env:
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          cat >> "$GRADLE_USER_HOME/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          EOF
          echo "MAPKIT_API_KEY=$MAPKIT_API_KEY" > local.properties

      - name: Сборка APK для эмулятора
        run: ./gradlew assembleDebug assembleDebugAndroidTest -Pwardclick.abis=x86_64

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Скриншоты на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.wardclick.app.ScreenshotTour com.wardclick.app.test/androidx.test.runner.AndroidJUnitRunner > instrument-light.txt 2>&1 || true
            adb shell cmd uimode night yes
            adb shell am instrument -w -e prefix dark_ -e class com.wardclick.app.ScreenshotTour com.wardclick.app.test/androidx.test.runner.AndroidJUnitRunner > instrument-dark.txt 2>&1 || true
            adb shell cmd uimode night no
            adb shell wm density 480
            adb shell settings put system font_scale 1.15
            adb shell am instrument -w -e prefix small_ -e class com.wardclick.app.ScreenshotTour com.wardclick.app.test/androidx.test.runner.AndroidJUnitRunner > instrument-small.txt 2>&1 || true
            adb exec-out run-as com.wardclick.app tar -cf - -C files screens > screens.tar

      - name: Выложить скриншоты в ветку ui-screens
        if: always()
        run: |
          mkdir -p out
          tar -xf screens.tar -C out || true
          cp instrument-*.txt out/ 2>/dev/null || true
          cd out
          git init -q -b ui-screens
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "UI screenshots ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ui-screens
