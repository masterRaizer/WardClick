name: Release

# Новая версия: git tag v1.2 && git push origin v1.2
# На странице релиза появятся APK (по архитектурам) и ZIP с полным кодом для Android Studio.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      # Те же ускорения, что в build.yml; кэш Gradle берётся из последней сборки main
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # compileSdk 37 (его требует Kyant Backdrop): на раннере этой платформы может не быть
      - name: Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      # Ключ Яндекс Карт берётся из секрета MAPKIT_API_KEY (Settings → Secrets → Actions)
      - name: Настройки Gradle и local.properties
        env:
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          cat >> "$GRADLE_USER_HOME/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          EOF
          echo "MAPKIT_API_KEY=$MAPKIT_API_KEY" > local.properties

      # все три ABI: arm64-v8a, armeabi-v7a, x86_64
      - name: Сборка APK
        run: ./gradlew assembleDebug

      - name: Подготовка файлов релиза
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-debug$//')
            cp "$f" "dist/WardClick-$TAG-$abi.apk"
          done
          git archive --format=zip --prefix=WardClick/ -o "dist/WardClick-$TAG-source.zip" HEAD
          # local.properties не хранится в git, но кладётся в архив с ключом карты:
          # Android Studio сама допишет туда sdk.dir при открытии проекта.
          mkdir -p zipextra/WardClick
          cp local.properties zipextra/WardClick/local.properties
          (cd zipextra && zip -q "../dist/WardClick-$TAG-source.zip" WardClick/local.properties)
          unzip -l "dist/WardClick-$TAG-source.zip" | tail -3
          ls -la dist

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "WardClick $TAG" --target "$GITHUB_SHA" --notes "$(cat <<NOTES
          **APK:** для телефона — \`WardClick-$TAG-arm64-v8a.apk\` (старые телефоны — armeabi-v7a, эмулятор — x86_64).

          **Код:** \`WardClick-$TAG-source.zip\` — распакуйте и откройте папку WardClick в Android Studio (File → Open).
          Ключ Яндекс Карт уже лежит в local.properties внутри архива.
          NOTES
          )"
          fi
